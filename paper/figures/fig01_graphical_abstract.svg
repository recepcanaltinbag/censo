   <g id="text_1">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:11px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 269.28, 20.850281)" x="269.28" y="20.850281">A non-detection is an upper bound, not a zero</text>
   </g>
   <g id="text_2">
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:7.6px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 269.28, 37.868812)" x="269.28" y="37.868812">The same measurement, the same legal threshold, read two ways</text>
   </g>
   <g id="text_3">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:8.4px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 135.9864, 77.680687)" x="135.9864" y="77.680687">What the record stores</text>
   </g>
   <g id="text_4">
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:6.6px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 135.9864, 90.212569)" x="135.9864" y="90.212569">a number, indistinguishable from a measured zero</text>
   </g>
   <g id="text_5">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:8.4px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 402.5736, 77.680687)" x="402.5736" y="77.680687">What the measurement established</text>
   </g>
   <g id="text_6">
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:6.6px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 402.5736, 90.212569)" x="402.5736" y="90.212569">an interval: the analyte may be present below the limit</text>
   </g>
   <g id="text_7">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:7.2px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 269.28, 277.14555)" x="269.28" y="277.14555">CENSO binds the quantification limit to the analytical run rather than to the instrument, so the interval survives into the data.</text>
   </g>
   <g id="text_8">
    <text style="fill:#123f66;font-family:DejaVu Sans;font-size:16px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 93.332448, 300.9578)" x="93.332448" y="300.9578">45%</text>
   </g>
   <g id="text_9">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(46.058073 314.697975)">of 33 million European samples</text>
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(44.932136 322.328475)">lie below the quantification limit</text>
   </g>
   <g id="text_10">
    <text style="fill:#7159a6;font-family:DejaVu Sans;font-size:16px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 269.28, 300.9578)" x="269.28" y="300.9578">32%</text>
   </g>
   <g id="text_11">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(208.719844 310.882725)">of assessments in 2020–2024 cannot be</text>
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(209.354062 318.513225)">determined from the record as reported</text>
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(226.391719 326.143725)">(44% over the whole record)</text>
   </g>
   <g id="text_12">
    <text style="fill:#a01e28;font-family:DejaVu Sans;font-size:16px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 450.559296, 300.9578)" x="450.559296" y="300.9578">40%</text>
   </g>
   <g id="text_13">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(397.328046 310.882725)">of assessments against a European</text>
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(399.627265 318.513225)">standard use a method failing the</text>
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(401.810233 326.143725)">legal LOQ criterion (2009/90/EC)</text>
   </g>
   <g id="text_14">
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:6.1px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(151.347461 338.831639)">EEA Waterbase: 4.2 million river station-years, 637 substances, 37 countries.</text>
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:6.1px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(50.919062 347.052819)">The reporting defect was repaired: no station-year has declared neither flag nor limit since 2013, and that repair is the whole of the fall above.</text>
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:6.1px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(74.591828 355.273998)">The analytical one was not — the method fails the standard in 19 % of recent assessments against 17 % over the whole record.</text>
   </g>

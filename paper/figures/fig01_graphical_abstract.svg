   <g id="text_1">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:11px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 269.28, 18.726641)" x="269.28" y="18.726641">A non-detection is an upper bound, not a zero</text>
   </g>
   <g id="text_2">
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:7.6px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 269.28, 32.412833)" x="269.28" y="32.412833">The same measurement, the same legal threshold, read two ways</text>
   </g>
   <g id="text_3">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:8.4px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 135.9864, 65.560028)" x="135.9864" y="65.560028">What the record stores</text>
   </g>
   <g id="text_4">
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:6.6px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 135.9864, 75.728977)" x="135.9864" y="75.728977">a number, indistinguishable from a measured zero</text>
   </g>
   <g id="text_5">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:8.4px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 402.5736, 65.560028)" x="402.5736" y="65.560028">What the measurement established</text>
   </g>
   <g id="text_6">
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:6.6px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 402.5736, 75.728977)" x="402.5736" y="75.728977">an interval: the analyte may be present below the limit</text>
   </g>
   <g id="text_7">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:7.2px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 269.28, 230.072742)" x="269.28" y="230.072742">CENSO binds the quantification limit to the analytical run rather than to the instrument, so the interval survives into the data.</text>
   </g>
   <g id="text_8">
    <text style="fill:#123f66;font-family:DejaVu Sans;font-size:16px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 93.332448, 253.503644)" x="93.332448" y="253.503644">45%</text>
   </g>
   <g id="text_9">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(46.058073 266.452611)">of 33 million European samples</text>
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(44.932136 274.083111)">lie below the quantification limit</text>
   </g>
   <g id="text_10">
    <text style="fill:#7159a6;font-family:DejaVu Sans;font-size:16px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 269.28, 253.503644)" x="269.28" y="253.503644">25%</text>
   </g>
   <g id="text_11">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(220.807031 266.452611)">of station-years record neither a</text>
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(231.758906 274.083111)">censoring flag nor a limit</text>
   </g>
   <g id="text_12">
    <text style="fill:#a01e28;font-family:DejaVu Sans;font-size:16px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 450.559296, 253.503644)" x="450.559296" y="253.503644">40%</text>
   </g>
   <g id="text_13">
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(397.328046 262.637361)">of assessments against a European</text>
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(399.627265 270.267861)">standard use a method failing the</text>
    <text style="fill:#1f1f1f;font-family:DejaVu Sans;font-size:6px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(401.810233 277.898361)">legal LOQ criterion (2009/90/EC)</text>
   </g>
   <g id="text_14">
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:6.1px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(151.347461 287.779141)">EEA Waterbase: 4.2 million river station-years, 637 substances, 37 countries.</text>
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:6.1px;font-stretch:normal;font-style:normal;font-weight:normal;" transform="translate(102.806234 296.000321)">The share recording no limit ranges from 3 % to 97 % between countries — reporting practice, not chemistry.</text>
   </g>

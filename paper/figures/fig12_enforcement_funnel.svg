   </g>
   <g id="text_12">
    <text style="fill:#7a7a7a;font-family:DejaVu Sans;font-size:9.5px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:end;" transform="rotate(-0, 176.882609, 251.63274)" x="176.882609" y="251.63274">−2,458</text>

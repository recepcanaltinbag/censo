   </g>
   <g id="text_18">
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:6.4px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 135.9864, 209.745648)" x="135.9864" y="209.745648">one of two possible verdicts</text>
   </g>
   <g id="text_19">
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:6.6px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:end;" transform="rotate(-0, 498.544992, 108.388598)" x="498.544992" y="108.388598">LOQ</text>
   </g>

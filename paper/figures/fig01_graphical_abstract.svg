   <g id="text_21">
    <text style="fill:#7159a6;font-family:DejaVu Sans;font-size:10px;font-stretch:normal;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 402.5736, 198.20898)" x="402.5736" y="198.20898">Cannot be determined</text>
   </g>
   <g id="text_22">
    <text style="fill:#6b7280;font-family:DejaVu Sans;font-size:6.4px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 402.5736, 209.745648)" x="402.5736" y="209.745648">a verdict the two-valued model cannot express</text>
